<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital AI - Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100" style="background:#f5f7fb;">

    <div class="card shadow-lg border-0" style="width:420px;border-radius:20px;">

        <div class="card-body p-5">

            <div class="text-center mb-4">
                <h2>🏥 Hospital AI</h2>
                <p class="text-muted">Admin Login</p>
            </div>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="admin@hospital.com"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="********"
                        required>
                </div>

                <button class="btn btn-dark w-100">
                    Login
                </button>

            </form>

            <p id="error" class="text-danger text-center mt-3"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
