<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital AI Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="bg-white rounded-4 p-4 mb-4 shadow border">
        <h1 class="text-center mb-0">🏥 Hospital AI Dashboard</h1>
    </div>

    <div class="row g-3 mb-4">

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <small>Total Appointments</small>
                    <h2 id="totalAppointments">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <small>Doctors</small>
                    <h2>12</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <small>AI Status</small><br>
                    <span class="badge bg-success">Online</span>
                </div>
            </div>
        </div>

    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">

        <input
            id="search"
            class="form-control w-50"
            placeholder="🔍 Search appointment...">

        <button class="btn btn-dark" onclick="loadAppointments()">
            Refresh
        </button>

    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="appointmentsTable">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
