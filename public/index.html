<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-lg-2 sidebar p-4">

            <h3 class="logo mb-5">
                🏥 Hospital AI
            </h3>

            <ul class="nav flex-column">

                <li class="nav-item mb-3">
                    <a class="nav-link active" href="#">
                        📊 Dashboard
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link" href="#">
                        📅 Appointments
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link" href="#">
                        👨‍⚕️ Doctors
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a class="nav-link" href="#">
                        ⚙ Settings
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main -->

        <div class="col-lg-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold mb-1">
                        Hospital Dashboard
                    </h2>

                    <small class="text-muted">
                        AI Appointment Management System
                    </small>

                </div>

                <button
                    class="btn btn-dark"
                    onclick="loadAppointments()">

                    Refresh

                </button><button class="btn btn-danger" onclick="logout()">
                    Logout
                </button>

            </div>

            <!-- Cards -->

            <div class="row g-4 mb-4">

                <div class="col-md-4">

                    <div class="card dashboard-card">

                        <div class="card-body">

                            <small>Total Appointments</small>

                            <h2 id="totalAppointments">
                                0
                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card dashboard-card">

                        <div class="card-body">

                            <small>Doctors</small>

                            <h2>
                                12
                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card dashboard-card">

                        <div class="card-body">

                            <small>AI Status</small>

                            <h2 class="text-success">
                                Online
                            </h2>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Search -->

            <div class="card mb-4">

                <div class="card-body">

                    <input
                        id="search"
                        class="form-control"
                        placeholder="Search patient...">

                </div>

            </div>

            <!-- Table -->

            <div class="card">

                <div class="card-body">

                    <h5 class="mb-4">
                        Recent Appointments
                    </h5>

                    <div class="table-responsive">

                        <table class="table align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Phone</th>
                                    <th>Doctor</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody id="appointmentsTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
